<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            /* Lighter base pink color */
            background-color: #fadadd;
            background-image: linear-gradient(180deg, #fadadd 0%, #ffedf0 100%);

            /* NEW BODY FONT */
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background-color 1s ease;
        }

        /* NEW HEADING FONT */
        h1,
        h2 {
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            /* Bold and Bubbly */
            color: #d63384;
            text-shadow: 3px 3px 0px rgba(255, 255, 255, 0.8);
            margin: 10px 0;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 3.5rem;
        }

        h2 {
            font-size: 2.2rem;
        }

        h4 {
            color: #d63384;
            font-weight: 700;
            position: relative;
            z-index: 100;
            font-size: 1.2rem;
        }

        /* --- THE AESTHETIC CARD STYLE (Glassmorphism) --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            /* Rounder corners */
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(214, 51, 132, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.9);
            text-align: center;
            max-width: 600px;
            width: 90%;
            display: none;
            flex-direction: column;
            align-items: center;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* List of details styling */
        .details-list {
            text-align: left;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.6);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            box-shadow: inset 0 0 10px rgba(255, 192, 203, 0.2);
        }

        .detail-item {
            font-size: 1.3rem;
            color: #d63384;
            margin: 12px 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon {
            font-size: 1.6rem;
        }

        /* Side Images */
        .side-img {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 250px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            transition: opacity 0.5s ease;
            border: 6px solid white;
        }

        .left-img {
            left: 40px;
        }

        .right-img {
            right: 40px;
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 30px;
            margin-top: 30px;
        }

        button {
            padding: 15px 35px;
            font-size: 1.4rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);

            /* Apply Cute Font to Buttons too */
            font-family: 'Fredoka', sans-serif;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            z-index: 20;
        }

        #noBtn {
            background-color: #ffffff;
            color: #ff4d6d;
        }

        /* Dropdown Styling */
        select {
            padding: 12px 20px;
            font-size: 1.3rem;
            color: #d63384;
            border: 3px solid #ff4d6d;
            border-radius: 20px;
            background-color: white;
            cursor: pointer;
            outline: none;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-family: 'Quicksand', sans-serif;
            font-weight: bold;
            width: 100%;
        }

        /* Image Grid for Happy Page */
        .img-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 10px 0;
        }

        .img-grid img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 15px;
            border: 4px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .img-grid img:hover {
            transform: scale(1.1);
        }

        .main-content {
            text-align: center;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #intermediatePage,
        #secMessage,
        #finalMessage {
            display: none;
        }
    </style>
</head>

<body>

    <img id="leftImg" class="side-img left-img" src="images/me1.JPG" alt="Valentine Image Left">
    <img id="rightImg" class="side-img right-img" src="images/me2.JPG" alt="Valentine Image Right">

    <div class="main-content" id="mainContainer">
        <div>
            <h1 id="questionText">Will you be my Valentine?</h1>
            <h4>Date: 14th Feb(fullday)</h4>
        </div>

        <div class="buttons">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <div class="glass-card" id="intermediatePage">
        <div class="img-grid">
            <img src="images/happy1.jpeg" alt="">
            <img src="images/happy2.jpeg" alt="">
        </div>

        <h1 style="font-size: 2.2rem; margin: 20px 0;">YIPPPIEEEEEEE ME CAN'T WAIT TO HOP AND NOM YAA</h1>
        <button id="detailsBtn" style="background: #9967bc; color: white;">CLICK FOR DETAILS!!!</button>

        <div class="img-grid">
            <img src="images/happy3.jpeg" alt="">
            <img src="images/happy4.jpeg" alt="">
        </div>
    </div>

    <div class="glass-card" id="secMessage">
        <h2>What do you think we are nomming?</h2>
        <select id="foodSelection">
            <option value="" disabled selected>Guess here...</option>
            <option value="italian">Italian 🍝</option>
            <option value="chinese">Chinese 🥟</option>
            <option value="asian">Asian 🍜</option>
        </select>
    </div>

    <div class="glass-card" id="finalMessage">
        <h1>OTAYYYY THANTIEWWW 💖</h1>
        <h2>SEE YA ON VALENTINES!!</h2>

        <div class="details-list">
            <div class="detail-item">
                <span class="icon">📍</span>
                <span><strong>Location:</strong> <span id="locationText">TBC</span></span>
            </div>
            <div class="detail-item">
                <span class="icon">📅</span>
                <span><strong>Date:</strong> 14th February 2026</span>
            </div>
            <div class="detail-item">
                <span class="icon">⏰</span>
                <span><strong>Time:</strong> 6:00pm</span>
            </div>
            <div class="detail-item">
                <span class="icon">👗</span>
                <span><strong>Dress Code:</strong> Comfy hehe</span>
            </div>
            <div class="detail-item">
                <span class="icon">🐰</span>
                <span><strong>Pre-requisites:</strong> Be hoppable</span>
            </div>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const mainContainer = document.getElementById('mainContainer');
        const leftImg = document.getElementById('leftImg');
        const rightImg = document.getElementById('rightImg');
        const questionText = document.getElementById('questionText');

        const intermediatePage = document.getElementById('intermediatePage');
        const secMessage = document.getElementById('secMessage');
        const finalMessage = document.getElementById('finalMessage');
        const detailsBtn = document.getElementById('detailsBtn');
        const foodSelection = document.getElementById('foodSelection');
        const locationText = document.getElementById('locationText');

        let yesScale = 1;
        let noClicks = 0;

        const leftImages = ["images/emo1.jpeg", "images/emo2.jpeg", "images/emo3.jpeg", "images/emo4.jpeg", "images/emo5.jpeg", "images/emo6.jpeg", "images/emo7.jpeg", "images/emo8.jpeg", "images/emo9.jpeg"];
        const rightImages = ["images/emo10.jpeg", "images/emo11.jpeg", "images/emo12.jpeg", "images/emo13.jpeg", "images/emo14.jpeg", "images/emo15.jpeg", "images/emo16.jpeg", "images/emo17.jpeg", "images/emo18.jpeg",];

        const colors = ["#fadadd", "#f5c2c7", "#e6a1ad", "#808080"];

        // --- NO BUTTON LOGIC ---
        noBtn.addEventListener('click', () => {
            noClicks++;
            yesScale += 0.7;
            yesBtn.style.transform = `scale(${yesScale})`;

            function moveNoButton() {
                let x, y, isOverlapping;
                const safeMargin = 30; // Keep button 30px away from edge
                const overlapPadding = 20;

                const maxWidth = window.innerWidth - noBtn.offsetWidth - safeMargin;
                const maxHeight = window.innerHeight - noBtn.offsetHeight - safeMargin;

                do {
                    x = Math.random() * (maxWidth - safeMargin) + safeMargin;
                    y = Math.random() * (maxHeight - safeMargin) + safeMargin;

                    const yesRect = yesBtn.getBoundingClientRect();
                    isOverlapping = (
                        x < yesRect.right + overlapPadding &&
                        x + noBtn.offsetWidth > yesRect.left - overlapPadding &&
                        y < yesRect.bottom + overlapPadding &&
                        y + noBtn.offsetHeight > yesRect.top - overlapPadding
                    );

                } while (isOverlapping);

                noBtn.style.position = 'fixed';
                noBtn.style.left = `${x}px`;
                noBtn.style.top = `${y}px`;
            }
            moveNoButton();

            if (noClicks < leftImages.length) {
                leftImg.src = leftImages[noClicks];
                rightImg.src = rightImages[noClicks];
            }

            if (noClicks < colors.length + 1) {
                document.body.style.backgroundColor = colors[noClicks];
            }

            if (noClicks === 1) questionText.innerText = "Are you sureeeee?";
            if (noClicks === 2) questionText.innerText = "Nuhuhhhhhhhhhhhhhhh";
            if (noClicks === 3) questionText.innerText = "Me give you one last chance";
            if (noClicks === 4) questionText.innerText = "Okay you owe me unlimited hops";
            if (noClicks === 5) questionText.innerText = "and unlimited leg armpit time";
            if (noClicks === 6) questionText.innerText = "and unlimited boobie time";
            if (noClicks === 7) questionText.innerText = "me gon smack ya";
            if (noClicks === 8) questionText.innerText = "RAHHHHHHHHHHHHHHHH";
            if (noClicks === 9) {
                questionText.innerText = "Fine. A brat has to be tamed";
                questionText.style.color = "#333";
            }
        });

        // --- YES BUTTON ---
        yesBtn.addEventListener('click', () => {
            mainContainer.style.display = 'none';
            leftImg.style.display = 'none';
            rightImg.style.display = 'none';
            intermediatePage.style.display = 'flex';
            document.body.style.backgroundColor = '#ffc2d1';
        });

        // --- DETAILS BUTTON ---
        detailsBtn.addEventListener('click', () => {
            intermediatePage.style.display = 'none';
            secMessage.style.display = 'flex';
        });

        // --- FOOD SELECTION ---
        foodSelection.addEventListener('change', function () {
            const choice = this.value;
            let locationName = "TBC";

            if (choice === "italian") locationName = "Yanhuo (we're nomming chinese me no care)";
            if (choice === "chinese") locationName = "Yanhuo (we're nomming chinese me no care)";
            if (choice === "asian") locationName = "Yanhuo (we're nomming chinese me no care)";

            locationText.innerText = locationName;

            secMessage.style.display = 'none';
            finalMessage.style.display = 'flex';
        });

    </script>
</body>

</html>
